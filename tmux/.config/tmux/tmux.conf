# ~/.config/tmux/tmux.conf
# Standalone config (replaces oh-my-tmux). Tuned for nvim + AeroSpace on a
# MacBook with a Japanese (JIS) keyboard.
#
# Key ownership, so the three tools never fight:
#   AeroSpace  -> Option (alt-*)      : windows / workspaces
#   tmux       -> Ctrl-Space prefix   : sessions / windows / panes
#   nvim       -> Space leader        : editor
#
# JIS note: only letters, digits and keys that sit in the same place on JIS
# and US layouts (- , . / ;) are used for important bindings.

# ---------------------------------------------------------------- prefix ----
# Ctrl-Space as prefix. macOS uses Ctrl-Space for "Select previous input
# source" by default; disable it in System Settings > Keyboard > Keyboard
# Shortcuts > Input Sources (the JIS 英数/かな keys switch input anyway).
unbind C-b
set -g prefix C-Space
# Press Ctrl-Space twice to send a literal Ctrl-Space to the app
# (e.g. blink.cmp / nvim-cmp "trigger completion").
bind C-Space send-prefix

# --------------------------------------------------------------- general ----
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"     # 24-bit colour (iTerm2 & co)
set -g extended-keys on                      # pass modified keys (C-S-*, etc.)
set -as terminal-features ",xterm*:extkeys"
set -s escape-time 10                        # nvim :checkhealth recommends < 300
set -g focus-events on                       # nvim autoread / gitsigns refresh
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on                      # OSC 52 (works over ssh too)
set -g display-time 2000
set -g repeat-time 600

set -g base-index 1                          # windows start at 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S / #W"

# Stay attached when the last session is closed: switch to another one.
set -g detach-on-destroy off

# -------------------------------------------------------------- bindings ----
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits open in the current directory.
#   v / |  : side by side   (like :vsplit)
#   s / -  : stacked        (like :split)
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Session tree moved from `s` (now a split) to `S`.
bind S choose-tree -Zs

# Fuzzy session picker / creator over zoxide dirs (see ~/.local/bin/tmux-sessionizer).
bind f display-popup -E -w 80% -h 60% "~/.local/bin/tmux-sessionizer"
# Jump back to the previous session.
bind Tab switch-client -l

# Panes, laid out like AeroSpace windows (same letters, prefix instead of ⌥):
#   h/j/k/l   focus the pane in that direction
#   H/J/K/L   move: swap with the pane in that direction (focus follows)
#   /         retile: toggle all panes side by side <-> stacked
#   Space     cycle every tmux layout (tmux default; includes main + stack)
#   r         resize mode: h/j/k/l resize, = even out, Esc or Enter to leave
#   z         zoom (AeroSpace's fullscreen)
#   @         pull a pane from another window in beside this one
#   !         push this pane out to its own window (tmux default)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H if -F "#{pane_at_left}"   "" "swap-pane -t '{left-of}' ; select-pane -L"
bind J if -F "#{pane_at_bottom}" "" "swap-pane -t '{down-of}' ; select-pane -D"
bind K if -F "#{pane_at_top}"    "" "swap-pane -t '{up-of}' ; select-pane -U"
bind L if -F "#{pane_at_right}"  "" "swap-pane -t '{right-of}' ; select-pane -R"
bind / if -F "#{==:#{@tiles},stacked}" \
  "select-layout even-horizontal ; set -w @tiles side-by-side" \
  "select-layout even-vertical ; set -w @tiles stacked"
bind r switch-client -T resize \; display "resize: h/j/k/l, = even out, Esc to leave"
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize = select-layout -E \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind @ choose-tree -Zw "join-pane -h -s '%%'"
bind z resize-pane -Z
bind x kill-pane                              # no confirmation prompt
bind X kill-window

# Window navigation: prefix + n/p (default), plus repeatable < > to reorder.
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Seamless Ctrl-h/j/k/l between nvim splits and tmux panes (no prefix).
# Works fully once the nvim side has christoomey/vim-tmux-navigator installed;
# without it, Ctrl-h/j/k/l inside nvim still move between nvim splits.
# Ctrl-l in a shell is taken; use `prefix Ctrl-l` to clear the screen.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l

# ------------------------------------------------------------- copy mode ----
# prefix + [ to enter (JIS [ key is right of @), v to select, y to copy.
# On macOS y also pipes to pbcopy. Everywhere (including over ssh from a
# Coder VM) set-clipboard sends the copy to the local terminal with OSC 52;
# iTerm needs "Applications in terminal may access clipboard" turned on.
setw -g mode-keys vi
if-shell "command -v pbcopy >/dev/null" "set -s copy-command pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ----------------------------------------------------------------- theme ----
# Catppuccin Mocha palette, matching the NvChad "catppuccin" theme.
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
# Session name turns red while the prefix is active.
set -g status-left "#[bg=#{?client_prefix,#f38ba8,#89b4fa},fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "
set -g status-right "#{?window_zoomed_flag,#[fg=#f9e2af]ZOOM ,}#[fg=#a6adc8]#{pane_current_command}  #[fg=#cdd6f4]%a %d %b %H:%M "
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I #W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g clock-mode-colour "#89b4fa"

# --------------------------------------------------------------- plugins ----
# Optional. Install TPM once, then press prefix + I inside tmux:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# tmux-resurrect + tmux-continuum restore sessions after a reboot.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
if-shell "test -x ~/.config/tmux/plugins/tpm/tpm" "run ~/.config/tmux/plugins/tpm/tpm"
