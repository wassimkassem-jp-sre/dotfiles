# ~/.config/aerospace/aerospace.toml
# AeroSpace tiling WM. Reference: https://nikitabobko.github.io/AeroSpace/guide
#
# Modifier: Option (alt). tmux uses Ctrl-Space and nvim uses Space, so they never clash.
#
# JIS keyboard note: AeroSpace binds by *physical key position* using US names
# (key-mapping.preset = 'qwerty'). On a JIS keyboard that means:
#   minus  -> the "-" key            (same place)
#   equal  -> the "^" key            (right of "-")
#   semicolon / comma / period / slash -> same keys as printed
# Avoid leftSquareBracket/rightSquareBracket/quote/backslash/backtick here:
# they land on JIS @ [ : ] and keys that don't exist.
#
# Only a few mnemonic letter workspaces are bound, so Option+<other letters>
# still types special characters in normal apps.

config-version = 2

start-at-login = true
after-startup-command = []
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when switching monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "A", "B", "C", "E", "N", "S", "T"]

key-mapping.preset = 'qwerty'

# Every workspace lives on the external monitor, whichever one is connected.
# Patterns are tried in order: the regex matches any monitor whose name does
# not start with "Built-in" (case-insensitive); 'main' is the fallback, so
# everything lands on the laptop screen when undocked. While docked the laptop
# screen just shows a spare, empty workspace.
[workspace-to-monitor-force-assignment]
C = ['^(?!built-in)', 'main']    # Chrome
A = ['^(?!built-in)', 'main']    # Claude
S = ['^(?!built-in)', 'main']    # Slack
T = ['^(?!built-in)', 'main']    # Terminal
E = ['^(?!built-in)', 'main']    # Editor
B = ['^(?!built-in)', 'main']    # Safari
N = ['^(?!built-in)', 'main']    # Notion
1 = ['^(?!built-in)', 'main']
2 = ['^(?!built-in)', 'main']
3 = ['^(?!built-in)', 'main']
4 = ['^(?!built-in)', 'main']
5 = ['^(?!built-in)', 'main']

[gaps]
inner.horizontal = 6
inner.vertical   = 6
outer.left       = 6
outer.bottom     = 6
outer.top        = 6
outer.right      = 6

# ---------------------------------------------------------------- main mode --
[mode.main.binding]
# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'

# Focus / move windows (vim keys)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Quick resize ("-" and the JIS "^" key), or alt-r for resize mode
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-r = 'mode resize'

# New iTerm window
alt-enter = '''exec-and-forget osascript -e 'tell application "iTerm" to create window with default profile' '''

# Workspaces: 1-5 free-form, letters are app homes (see on-window-detected below).
# Named by the app's first letter; on a collision, the next free letter.
#   C chrome · A claude (C taken, L is focus-right) · S slack · T terminal
#   E editor (Cursor/VS Code) · B safari · N notion
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-c = 'workspace C'
alt-a = 'workspace A'
alt-s = 'workspace S'
alt-t = 'workspace T'
alt-e = 'workspace E'
alt-b = 'workspace B'
alt-n = 'workspace N'

alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-c = ['move-node-to-workspace C', 'workspace C']
alt-shift-a = ['move-node-to-workspace A', 'workspace A']
alt-shift-s = ['move-node-to-workspace S', 'workspace S']
alt-shift-t = ['move-node-to-workspace T', 'workspace T']
alt-shift-e = ['move-node-to-workspace E', 'workspace E']
alt-shift-b = ['move-node-to-workspace B', 'workspace B']
alt-shift-n = ['move-node-to-workspace N', 'workspace N']

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

# -------------------------------------------------------------- resize mode --
[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
minus = 'resize smart -50'
equal = 'resize smart +50'
b = ['balance-sizes', 'mode main']
enter = 'mode main'
esc = 'mode main'

# ------------------------------------------------------------- service mode --
# alt-shift-; then one of these
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']   # reset layout
f = ['layout floating tiling', 'mode main']
b = ['balance-sizes', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# -------------------------------------------------------------- app routing --
# Every new window of these apps is sent to its workspace when it opens
# (on launch and for any later window). Rules apply top to bottom.
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace A'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'   # Cursor
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace N'

# Utility windows float instead of tiling
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'cc.ffitch.shottr'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'
